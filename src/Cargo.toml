[package]
name = "rustydeck"
version = "2.14.0"
description = "Native Linux app for Stream Deck devices"
# Built on OpenDeck by Aman Khanna, whose backend this vendors; see README and LICENSE.md.
authors = ["Leo Termine", "Aman Khanna (nekename)"]
license = "GPL-3.0-or-later"
repository = "https://github.com/mirairoad/rustydeck"
default-run = "rustydeck"
edition = "2024"

[dependencies]
# Large, fundamental libraries
gpui = "0.2.2"
gpui-component = "0.5"
gpui-component-assets = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
elgato-streamdeck = { version = "0.13", default-features = false, features = ["async"] }
hidapi = "2.6"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"] }
streamdeck-strip-render = { git = "https://github.com/FrostyCoolSlug/streamdeck-strip-render", rev = "23fa1399" }

# Smaller utility libraries
base64 = "0.22"
path-slash = "0.2"
serde-inline-default = "1.0"
serde_with = "3.16"
active-win-pos-rs = "0.10"
dashmap = { version = "6.1", features = ["serde"] }
futures = "0.3"
anyhow = "1.0"
log = "0.4"
log-panics = "2.1"
open = "5.3"
simplelog = "0.12"
tray-icon = "0.20"
dirs = "6.0"
rfd = "0.15"

fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }
font-kit = { package = "zed-font-kit", version = "0.14.1-zed" }
ab_glyph = "0.2"
resvg = "0.45"
chrono = "0.4"
psp = { git = "https://github.com/pewsheen/psp", rev = "d2936425122e26822a2c126e958ca966cac82b3c" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
gtk = "0.18"

[profile.release]
# This ships as a single desktop binary, so favour size and let the build take longer:
# one codegen unit and fat LTO let the linker drop what nothing reaches, and the debug
# symbols that dominate the unoptimised build are stripped out entirely.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
